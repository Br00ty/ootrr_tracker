<!DOCTYPE html>
<!--
  OOTRR Tracker. Logic, settings decoding and save reading are ported from OOTRR (https://github.com/ootrando/ootrr),
  and its data files are embedded (0.8.2). OOTRR is licensed GPL-3.0-or-later, so this tracker is too:
  GNU General Public License v3 or later, https://www.gnu.org/licenses/gpl-3.0.html. Logic parts follow the OoT Randomizer's design (MIT).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OOTRR Tracker</title>
<style>
:root{
  --bg:#14130f; --panel:#1d1b16; --panel2:#262319; --line:#3a3528; --ink:#ece4cf; --dim:#9a917b; --faint:#6b6452;
  --gold:#d9b45a; --green:#3fb56b; --yellow:#f0c43c; --red:#e0533f; --grey:#6f6a5e; --blue:#6d8fd1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0;letter-spacing:.06em;color:var(--gold);font-weight:700;white-space:nowrap}
@media (max-width:1500px){header h1 small{display:none}}
header h1 small{color:var(--dim);font-weight:400;letter-spacing:0;margin-left:6px}
.stats{display:flex;gap:14px;flex-wrap:nowrap;white-space:nowrap}
.stat{display:flex;align-items:center;gap:6px;color:var(--dim)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.g{background:var(--green)}.y{background:var(--yellow)}.r{background:var(--red)}.d{background:var(--grey)}
.spacer{flex:1}
.btn{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
a.btn{color:inherit;text-decoration:none;display:inline-block}
@media (max-width:2000px){h1 small{display:none}}
main{flex:1;display:grid;grid-template-columns:minmax(330px,390px) 250px 1fr;min-height:0}
/* wide screens (1920x1080 and up): counters, keys and trade items get their own column, and the dungeons sit
   beside the overworld, so nothing needs scrolling; narrower screens keep three columns */
main section.wide{display:none}
@media (min-width:1500px){
  main{grid-template-columns:minmax(330px,390px) minmax(290px,330px) 250px 250px 1fr}
  main section.wide{display:block}
}
.grid.g5{grid-template-columns:repeat(5,1fr)}
section{border-right:1px solid var(--line);overflow:auto;min-height:0}
section:last-child{border-right:0}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:14px 14px 6px;font-weight:600}
/* items */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:0 12px}
.it{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--panel);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.1;padding:2px;cursor:pointer;user-select:none;color:var(--faint);transition:background .1s}
.it:hover{border-color:var(--gold)}
.it.on{background:#33301f;color:var(--ink);border-color:#6a5c32}
.it img{width:82%;height:82%;object-fit:contain;filter:grayscale(1) brightness(1.1);opacity:.38;pointer-events:none}
.it.on img{filter:none;opacity:1}
.it.pic{padding:0}
.ico{width:18px;height:18px;object-fit:contain;vertical-align:middle;margin-right:5px}
.bk.pic{padding:0 3px;display:inline-flex;align-items:center}
.bk.pic img{width:18px;height:18px;object-fit:contain;filter:grayscale(1) brightness(1.1);opacity:.38}
.bk.pic.on img{filter:none;opacity:1}
/* the counters column: small enough that counters, keys and silver rupees fit a 1080p window with pictures on */
#items2 h2{margin:10px 14px 4px}
.dtab .ico{width:15px;height:15px}
.dtab .bk.pic img{width:15px;height:15px}
.dtab .bk{padding:0 6px;line-height:15px}
.dtab .cnt button{width:17px;height:17px}
.it .n{position:absolute;right:3px;bottom:2px;font-size:10px;font-weight:700;color:var(--gold)}
.it.arrow.on{background:#33261c;border-color:#7a5a32}
.it.song.on{background:#2a2633;border-color:#5b4f7a}
.it.stone.on{background:#1f3029;border-color:#3c6e58}
.it.med.on{background:#2f2428;border-color:#7a4f5f}
.dtab{width:calc(100% - 24px);margin:0 12px;border-collapse:collapse;font-size:12px}
.dtab td{padding:1px 4px;border-bottom:1px solid var(--line)}
.dtab td:first-child{color:var(--dim)}
.cnt{display:inline-flex;align-items:center;gap:4px}
.cnt button{width:19px;height:19px;border-radius:4px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;padding:0;line-height:1}
.cnt span{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.bk{white-space:nowrap;border:1px solid var(--line);border-radius:4px;padding:1px 7px;cursor:pointer;background:var(--panel);color:var(--faint)}
.bk.on{background:#33301f;color:var(--gold);border-color:#6a5c32}
.hint{color:var(--faint);font-size:11px;padding:6px 14px 14px}
/* areas */
.area{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;border-left:3px solid transparent}
.area:hover{background:var(--panel)}
.area.sel{background:var(--panel2);border-left-color:var(--gold)}
.area .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area .door{display:block;font-size:11px;line-height:1.3;color:var(--gold);white-space:normal}
.area .door.hid{color:var(--faint)}
.area .door:hover{text-decoration:underline}
.area.done .nm{color:var(--faint)}
.pills{display:flex;gap:3px}
.tilehelp{position:relative;top:-2px;width:15px;height:15px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font-size:10px;line-height:13px;text-align:center;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:700}
.tilehelp:hover{color:var(--gold);border-color:var(--gold)}
.pill{min-width:20px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:700;text-align:center;color:#111}
.pill.g{background:var(--green)}.pill.y{background:var(--yellow)}.pill.r{background:var(--red);color:#fff}
/* checks */
.ckhead{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.ckhead h3{margin:0;font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px 8px}
.chip{border:1px solid var(--line);border-radius:12px;padding:2px 9px;cursor:pointer;background:var(--panel);font-size:12px;color:var(--dim)}
.chip.on{border-color:var(--gold);color:var(--ink)}
.ck{display:flex;align-items:center;gap:10px;padding:5px 16px;cursor:pointer;border-bottom:1px solid #221f18}
.ck:hover{background:var(--panel)}
.ck .nm{flex:1}
.ck.st-done .nm{color:var(--faint);text-decoration:line-through}
.ck .price{font-size:11px;color:var(--gold);white-space:nowrap}
.ck .kind{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;width:44px;text-align:right}
.age{font-size:10px;font-weight:700;border-radius:3px;padding:0 4px;border:1px solid var(--line);color:var(--faint)}
.age.ok{color:#111;background:var(--green);border-color:var(--green)}
.age.ol{color:#111;background:var(--yellow);border-color:var(--yellow)}
.st-g .dot{background:var(--green)}.st-y .dot{background:var(--yellow)}.st-r .dot{background:var(--red)}.st-done .dot{background:var(--grey)}
.empty{color:var(--faint);padding:20px 16px}
.ck{user-select:none}
.ck.open{background:var(--panel2)}
.desc{padding:4px 16px 9px 36px;font-size:12px;line-height:1.45;color:var(--dim);background:var(--panel2);border-bottom:1px solid #221f18}
.desc b{color:var(--ink);font-weight:600}
.desc .way{margin-top:6px}
.xa{font-size:10px;font-weight:700;color:#e9c46a;border:1px solid #7a6a3a;border-radius:3px;padding:0 4px;white-space:nowrap}
.desc .cross{color:#e9d7a6;margin-bottom:5px;display:flex;gap:6px;align-items:baseline}
.desc .from{color:var(--dim)}
.desc .q{display:block;margin-top:3px;color:#cdbf98;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
/* settings */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0;width:min(560px,92vw)}
dialog::backdrop{background:#0009}
.dlg{padding:16px 20px}
.dlg h3{margin:0 0 10px;color:var(--gold)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.row label{color:var(--dim)}
.row select,.row input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:6px 0 10px}
dialog.wide{width:min(860px,94vw)}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.preset{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.preset b{color:var(--ink);font-size:12px}.preset span{color:var(--dim);font-size:11px;line-height:1.3}
.preset:hover{border-color:var(--gold)}.preset.on{border-color:var(--gold);background:#33301f}
.stabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:12px;border-bottom:1px solid var(--line);padding-bottom:6px}
.stabs button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;color:var(--dim)}
.stabs button.on{border-color:var(--gold);color:var(--gold);background:#33301f}
.stabs{flex-direction:column;align-items:stretch}
.stabrow{display:grid;grid-template-columns:78px 1fr;gap:6px;align-items:start}
.stabbtns{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.stabs .shead{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding-top:7px}
.ssec{margin:12px 0 0;font-size:12px;color:var(--gold);font-weight:600;border-bottom:1px solid var(--line);padding-bottom:4px}
.ssec:first-child{margin-top:4px}
.slist{max-height:min(52vh,560px);overflow:auto;margin-top:4px;padding-right:4px}
.srow{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.srow.off{opacity:.5}
.stext{flex:1;min-width:0}
.stip{color:var(--faint);font-size:11px;line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sctl{flex:none;max-width:52%;display:flex;justify-content:flex-end}
.sctl select,.sctl input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:3px 6px;max-width:260px}
.sctl input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold)}
.foot{display:flex;justify-content:space-between;gap:8px;padding-top:14px}
.legend{display:flex;gap:12px;color:var(--dim);font-size:11px;padding:6px 16px 0;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.err{color:var(--red);padding:20px}
.seedbox{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.seedbox .seed{border:1px solid #6a5c32;background:#2a2516;color:var(--gold);border-radius:6px;padding:4px 8px;white-space:nowrap;cursor:pointer}
.banner{background:#2b2214;border-bottom:1px solid #5a4a26;color:#e9d7a6;font-size:12px;padding:6px 16px}
.bannerx{flex:none;background:none;border:1px solid #5a4a26;border-radius:4px;color:#e9d7a6;width:20px;height:20px;line-height:16px;padding:0;font-size:11px;cursor:pointer}
.bannerx:hover{border-color:var(--gold);color:var(--gold)}
.banner b{color:var(--gold)}
.sv-list{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin:8px 0;padding:4px 10px;font-size:12px}
.sv-list div{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px solid #2a271e}
.sv-list span:last-child{color:var(--ink);text-align:right}
.auto{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px}
.auto .live{flex:none;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.auto .live.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.auto .live.err{background:var(--red);padding:0}
.auto label{white-space:nowrap}
.auto b{color:var(--ink);font-weight:600}
.it.auto{box-shadow:inset 0 -2px 0 var(--green)}
/* an item a gossip stone you've heard named: a blue hue (the hover tells what the stone said) */
.it.hinted{border-color:#4a8fd6;background:#1c2a3c;box-shadow:0 0 8px rgba(74,163,255,.45)}
.it.hinted.on{background:#22354d;border-color:#5aa6f0}
.it.hinted img{filter:grayscale(.4) sepia(1) hue-rotate(175deg) saturate(2.2) brightness(1.05);opacity:.75}
.it.hinted.on img{filter:sepia(.35) hue-rotate(175deg) saturate(1.6);opacity:1}
.it.hinted.auto{box-shadow:inset 0 -2px 0 var(--green),0 0 8px rgba(74,163,255,.45)}
.dtab tr.hinted td{color:#8cc4ff}
.dtab tr.hinted td:first-child{box-shadow:inset 2px 0 0 #4a8fd6}
.stones{max-width:620px;max-height:65vh;overflow:auto;font-size:12.5px}
.stones label{display:flex;gap:8px;align-items:flex-start;padding:4px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.stones .st{min-width:180px;color:var(--faint)}
.stones .heard .st{color:#8cc4ff}
.ck .sv{font-size:10px;color:var(--green);border:1px solid #2e5a3e;border-radius:3px;padding:0 4px}
.ck .sv.broke{color:var(--yellow);border-color:#6a5a24}
/* map tracker: the map takes the place of the overworld, dungeon and location columns */
.mode{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mode button{background:var(--panel2);border:0;padding:5px 10px;cursor:pointer;color:var(--dim);white-space:nowrap}
.mode button+button{border-left:1px solid var(--line)}
.mode button.on{background:#33301f;color:var(--gold)}
#mapview{display:none;grid-column:2/-1;overflow:hidden;flex-direction:column}
@media (min-width:1500px){#mapview{grid-column:3/-1}}
main.mapmode #areas,main.mapmode #dungeons,main.mapmode #checks{display:none}
main.mapmode #mapview{display:flex}
.mapbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.mapbar select{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.mapbar .seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mapbar .seg button{background:var(--panel2);border:0;padding:3px 9px;cursor:pointer;color:var(--dim)}
.mapbar .seg button+button{border-left:1px solid var(--line)}
.mapbar .seg button.on{background:#33301f;color:var(--gold)}
.mapbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;background:#0f0e0b}
.mapbox img{max-width:100%;max-height:100%;aspect-ratio:3/2;object-fit:fill;width:auto;height:auto;display:block}
.mapbox .empty{max-width:520px;text-align:center;line-height:1.6}
.mapwrap{flex:1;min-height:0;display:flex}
.maplist{flex:1;min-height:0;overflow:auto}
.mapside{width:270px;flex:none;border-left:1px solid var(--line);overflow:auto}
.mapside h2{margin-top:12px}
/* the Map Tracker's squeezed area list, far right: every area's counts at a glance */
.mapareas{width:188px;flex:none;border-left:1px solid var(--line);overflow:auto;font-size:11.5px;padding-bottom:8px}
.mapareas h2{margin:10px 8px 3px;font-size:10px}
.mapareas .area{padding:2px 6px 2px 8px;gap:4px;border-left-width:2px}
.mapareas .pill{min-width:16px;padding:0 4px;font-size:10px;line-height:15px}
.mapareas .door{display:none}
.mapside .ck{padding:4px 12px}
.mapside .desc{padding-left:24px}
.mapfit{position:relative;aspect-ratio:3/2;max-width:100%;max-height:100%;width:100%}
.mapfit img{position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;border:2px solid #111;box-shadow:0 0 0 1px #0008,0 1px 4px #000c;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#111;z-index:1}
.pin.many{width:22px;height:22px}
.pin.door{width:24px;height:24px;border-color:var(--gold);z-index:2;font-size:10px}
.pin.door.unknown{background:var(--panel2);color:var(--gold);font-size:13px}
.pin.pie{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 0 3px #000;opacity:1}
.pin:hover{transform:translate(-50%,-50%) scale(1.25);z-index:3}
.pin.g{background:var(--green)}.pin.y{background:var(--yellow)}.pin.r{background:var(--red);color:#fff}.pin.done{background:var(--grey);opacity:.75}
.pin.sel{outline:2px solid var(--gold);outline-offset:2px;z-index:3}
.linkmark{position:absolute;width:42px;height:42px;margin:-21px 0 0 -21px;z-index:4;pointer-events:auto;transition:left .9s linear,top .9s linear;filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 4px rgba(0,0,0,.6))}
.linkmark>*{width:100%;height:100%;display:block;transition:transform .3s}
.linkmark.old{opacity:.6}
.pinpop{position:absolute;z-index:4;min-width:260px;max-width:360px;background:var(--panel);border:1px solid var(--gold);border-radius:8px;box-shadow:0 4px 18px #000c;max-height:60%;overflow:auto}
.pinpop .ck{padding:4px 10px}
.vsong{color:var(--faint);font-size:11px}
.pinpop .desc{padding:4px 10px 8px 26px}
.pinpop{max-width:440px}
body.drag::after{content:"Drop a .ootrr seed, a save folder or progress.sav";position:fixed;inset:12px;border:2px dashed var(--gold);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold);background:#000a;pointer-events:none}
</style>
</head>
<body>
<header>
  <h1>OOTRR TRACKER<small>OoT Remake randomizer</small></h1>
  <div class="stats" id="stats"></div>
  <div class="mode" id="modeBox" title="Switch between the list of locations and the game's maps"></div>
  <div class="spacer"></div>
  <div class="auto" id="autoBox"></div>
  <input type="file" id="saveFile" webkitdirectory directory multiple hidden>
  <input type="file" id="seedFile" accept=".ootrr,.json" hidden>
  <div class="seedbox" id="seedBox"></div>
  <button class="btn" id="castBtn" title="Open a clean item tracker in its own window, for streaming (for example as an OBS window capture)">Broadcast view</button>
  <button class="btn" id="iconBtn" title="Item pictures from OOTRR's icon cache, and the game's maps for the Map Tracker">Icons &amp; Maps</button>
  <input type="file" id="iconFile" webkitdirectory directory multiple hidden>
  <button class="btn" id="setBtn">Settings</button>
  <button class="btn" id="resetBtn" title="Clear items and checked locations">Reset progress</button>
  <a class="btn" id="bugBtn" href="https://github.com/Br00ty/ootrr_tracker/issues/new?template=bug_report.yml" target="_blank" rel="noopener" title="Found something wrong? Open a bug report on GitHub (needs a GitHub account)">Report a bug</a>
  <button class="btn" id="aboutBtn" title="What this tracker is, which randomizer it's for, and how it was made">About</button>
</header>
<div class="banner" id="banner" hidden></div>
<main>
  <section id="items"></section>
  <section id="items2" class="wide"></section>
  <section id="areas"></section>
  <section id="dungeons" class="wide"></section>
  <section id="checks"></section>
  <section id="mapview"></section>
</main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>/*ENGINE*/</script>
<script>/*AUTO*/</script>
<script>/*SEED*/</script>
<script>/*TEX*/</script>
<script>const DATA = /*DATA*/;</script>
<script>
"use strict";
const KEY = "ootrr-tracker-v1";
// ---------- tracker-only renames ----------
// Checks the tracker shows under another name or area than OOTRR/OoTR give them, because in the
// remake they are somewhere else. Only the label and the list they sit in change: the logic, the seed's
// placements, the save detection and everything read from OOTRR keep the original name (the key here).
// When updating from a new OOTRR release, search for the original name: it is still the real one.
const RENAMES = {
  // The remake's hidden hole in Lake Hylia (save flag LakeHylia_secretHole_appearTreasureBox) holds the
  // chest OOTRR's catalog pins to this name (IsTreasureBoxOpen.6900843020594897860).
  "HF Open Grotto Chest": { name: "LH Open Grotto Chest", area: "Lake Hylia" },
  // A remake-only chest that a Poe guards on the Lake Hylia shore (IsTreasureBoxOpen.17023457248274633121).
  "HF Lake Poe Chest": { name: "LH Poe Chest", area: "Lake Hylia" },
  // 2026-11-21, the user: the fifth basement silver rupee is behind rocks you blow up, not at the top of the ladders

  catch (e) { W.err = `Couldn't read ${f.name}: ${e.message}`; paintAuto(); return; }
  const fresh = !S.seed || seedId(S.seed) !== seedId(sd);
  S.seed = sd;
  if (fresh) {  // a different seed is a new run
    S.items = {}; S.done = {}; S.auto = { items: {}, done: {} }; S.ignore = {}; S.reveal = {}; S.heard = {}; lastSig = ""; lastMap = ""; lastFloor = ""; LIVE.saveSig = "";
  }
  W.err = "";

}

function paintSeed() {
  const box = $("#seedBox");
  if (S.seed) {
    box.replaceChildren(h("span", { class: "seed", title: `${S.seed.settingsString}\nClick to see the seed's settings`, onclick: openSettings }, `Seed ${S.seed.seed}`),
      h("button", { class: "btn", onclick: () => $("#seedFile").click(), title: "Load a different .ootrr seed file" }, "Load seed"));
  } else {
    box.replaceChildren(h("button", { class: "btn", onclick: () => $("#seedFile").click(), title: "Load the .ootrr file ootrr generated: the tracker takes its settings and shuffled locations" }, "Load seed"));
  }
  // what a seed asks for that the tracker cannot model yet
  const notes = [];
  if (S.seed) {
    const v = S.seed.vals;
    if (ENTR_ERR) notes.push(`This seed's dungeon entrances couldn't be read (${ENTR_ERR}). The tracker's logic assumes vanilla entrances.`);
    else if (v.shuffle_entrances && v.shuffle_entrances !== "off" && v.shuffle_entrances !== "dungeons") notes.push("Entrances are shuffled in this seed. The tracker only follows shuffled dungeon entrances; the rest of its logic assumes vanilla entrances.");
    else if (entrancesShuffled()) notes.push(h("span", {}, "Dungeon entrances are shuffled in this seed, and the logic follows them. Under each dungeon, click ", h("b", {}, "door: ?"), " to show which door leads to it, or ",
      h("a", { href: "#", style: "color:var(--gold)", onclick: (e) => { e.preventDefault(); const all = DUNGEON_AREAS.filter((d) => POOL.has(d)); const open = all.every((d) => S.reveal[d]); all.forEach((d) => (S.reveal[d] = !open)); render(); } }, "show or hide them all"), "."));
    if (v.shuffle_shops && v.shuffle_shops !== "off") notes.push("Shop shelves are shuffled in this seed. Shop items and prices aren't tracked yet.");
    if (S.seed.warn.length) notes.push("Settings notes: " + S.seed.warn.join("; "));
    if (Seed.isLegacy(S.seed.generator)) notes.push(`This seed was made with ${S.seed.generator}. The tracker reads its settings as that version did, but works out logic with OOTRR 0.8.2's rules, so a few checks 0.8 changed can show differently (child boss fights need the Kokiri Sword, Bombchu Bowling and the Bombchu Shop are open from the start).`);
  }
  // the X closes the notes for this seed; another seed (or other notes) brings them back
  const b = $("#banner");
  const sig = notes.map((n) => (typeof n === "string" ? n : n.textContent)).join("|");
  b.hidden = !notes.length || S.bannerClosed === sig;
  b.replaceChildren(h("div", { style: "display:flex;gap:12px;align-items:flex-start" },
    h("div", { style: "flex:1" }, notes.map((n) => h("div", {}, n))),
    h("button", { class: "bannerx", title: "Close: I've read this", onclick: () => { S.bannerClosed = sig; save(); b.hidden = true; } }, "✕")));
}

function detectMap() {

  for (const [base, k] of Object.entries(POOL_KEYS)) for (let i = 1; i <= k.length; i++) if (DATA.checks[`${base} ${i}`]) out[`${base} ${i}`] = [{ k, n: i }];
  for (const [n, f] of Object.entries(OWN_FLAGS)) out[n] = [{ f }];
  for (const [n, f] of Object.entries(EXTRA_FLAGS)) if (out[n]) out[n] = [...out[n], { f }];
  for (const [n, f] of Object.entries(OOTRR_FLAGS)) if (DATA.checks[n]) out[n] = [...(out[n] || []), { f }];
  for (const [n, f] of Object.entries(BOSS_FLAGS)) if (DATA.checks[n]) out[n] = [...(out[n] || []), { f }];
  // OOTRR's web tracker's NPC and reward flags (its confirmed ones and its guesses), added to each check's rule
  for (const [n, e] of Object.entries(DATA.npc_flags || {})) if (DATA.checks[n]) out[n] = [...(out[n] || []), { f: e.f }];
  // flags OOTRR's data gives the wrong check: taken off it (a rule left with nothing is dropped)
  for (const [n, f] of Object.entries(DROP_FLAGS)) if (out[n]) {
    out[n] = out[n].map((r) => (r.f ? { ...r, f: r.f.filter((x) => !f.includes(x)) } : r)).filter((r) => !r.f || r.f.length || r.k || r.g);

  // Fortress the carpenters' clear event has played before you meet the card's guard
  const vals = S.seed ? S.seed.vals : manualVals(), pre = new Set();
  for (const [id, val, fl] of DATA.start_flags || []) if (String(vals[id]) === val) fl.forEach((f) => pre.add(f));
  if (pre.size) for (const n of Object.keys(out)) {
    out[n] = out[n].map((r) => (r.f && r.f.some((x) => pre.has(x)) ? { ...r, f: r.f.filter((x) => !pre.has(x)) } : r)).filter((r) => !r.f || r.f.length || r.k || r.g);
    if (!out[n].length) delete out[n];

}

async function newestSave(dir) {
  // Finds progress.sav in this folder or any folder below it (slot_00, slot_01 …, up to 4 levels),
  // and returns the one written last.
  let best = null;
  const visit = async (d, label, depth) => {
    for await (const [name, h] of d.entries()) {
      if (h.kind === "file" && name === "progress.sav") {
        try { const f = await h.getFile(); if (!best || f.lastModified > best.f.lastModified) best = { f, label }; } catch (e) {}

    h("div", { class: "foot" }, h("span"), h("button", { class: "btn", onclick: () => $("#dlg").close() }, "Close"))));
  if (!$("#dlg").open) $("#dlg").showModal();
